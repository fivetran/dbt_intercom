version: 1.9.0
pr_number: 93
new_features:
- description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_intercom/issues/new/choose).
under_the_hood:
- description: Documents the `first_team_id`, `last_team_id`, `first_team_name`, and `last_team_name` columns in [intercom__conversation_metrics](https://fivetran.github.io/dbt_intercom/#!/model/model.intercom.intercom__conversation_metrics). The model already output these fields, but they were missing from the yml, so they did not appear in the dbt docs or Quickstart.
