version: 1.8.2
under_the_hood:
- description: Documents the `first_team_id`, `last_team_id`, `first_team_name`, and
    `last_team_name` columns in [intercom__conversation_metrics](https://fivetran.github.io/dbt_intercom/#!/model/model.intercom.intercom__conversation_metrics).
    The model already output these fields, but they were missing from the yml, so they
    did not appear in the dbt docs or Quickstart.
